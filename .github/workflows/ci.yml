name: Remembrall CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Node.js Tests & CLI
        run: |
          node --test tests/*.test.js
          node bin/remembrall.js validate
          node bin/remembrall.js status

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate Manifest Constraints
        run: |
          python .agents/skills/remembrall/scripts/remembrall.py validate

      - name: Test MCP Server Handshake
        run: |
          python -c "import subprocess, json; p = subprocess.Popen(['python', '.agents/skills/remembrall/scripts/mcp_server.py'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True); out, _ = p.communicate(json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': 'initialize'}) + '\n'); assert 'remembrall' in out, 'MCP Handshake Failed'"

      - name: Test Package Install & CLI Entrypoints
        run: |
          pip install -e .
          remembrall status
