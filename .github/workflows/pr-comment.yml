name: Remembrall PR Memory Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  memory-check:
    name: Validate Agent State & PR Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate PR Memory Report
        id: report
        run: |
          node bin/remembrall.js validate
          DIAGRAM=$(node bin/remembrall.js diagram)
          STATUS=$(node bin/remembrall.js status)
          
          cat << 'EOF' > pr_comment.md
          ### 🔮 Remembrall State Engine Report

          ✅ **Manifest Status:** Validated & Token-Optimized (<120 line ceiling).
          
          ```text
          EOF
          node bin/remembrall.js status >> pr_comment.md
          cat << 'EOF' >> pr_comment.md
          ```

          #### 🗺️ Architecture Roadmap
          ```mermaid
          EOF
          node bin/remembrall.js diagram >> pr_comment.md
          cat << 'EOF' >> pr_comment.md
          ```

          *Automated state verification powered by [Remembrall](https://github.com/dkrpl/remembrall).*
          EOF

      - name: Comment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr_comment.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
