<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#111c2e"/>
      <stop offset="60%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#04070c"/>
    </radialGradient>

    <!-- Core Neural Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Glass Sphere Gradient -->
    <linearGradient id="glassBody" x1="30%" y1="15%" x2="70%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Highlight Reflection -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1e293b" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Subtle Synaptic Circuit Grid -->
  <g stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.35" fill="none">
    <circle cx="256" cy="256" r="190" stroke-dasharray="6 8"/>
    <circle cx="256" cy="256" r="160" stroke-opacity="0.2"/>
    <line x1="66" y1="256" x2="446" y2="256" stroke-opacity="0.2"/>
    <line x1="256" y1="66" x2="256" y2="446" stroke-opacity="0.2"/>
  </g>

  <!-- Deep Ambient Ambient Glow -->
  <circle cx="256" cy="256" r="120" fill="url(#coreGlow)" filter="url(#glowFilter)"/>

  <!-- Orbital Synaptic Rings -->
  <ellipse cx="256" cy="256" rx="145" ry="58" fill="none" stroke="url(#ringGrad)" stroke-width="3" transform="rotate(-28 256 256)"/>
  <ellipse cx="256" cy="256" rx="145" ry="58" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="14 20" transform="rotate(32 256 256)"/>

  <!-- The Main Memory Glass Orb -->
  <circle cx="256" cy="256" r="108" fill="url(#glassBody)"/>
  <circle cx="256" cy="256" r="108" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- Neural Core Lattice Nodes -->
  <g fill="#a7f3d0" stroke="#059669" stroke-width="1.5">
    <!-- Connecting neural lines -->
    <path d="M236 230 L276 240 L256 280 Z" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M276 240 L290 270 L256 280" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.6"/>
    <path d="M236 230 L216 265 L256 280" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.6"/>

    <!-- Synapse Nodes -->
    <circle cx="256" cy="256" r="8" fill="#ffffff" filter="url(#glowFilter)"/>
    <circle cx="236" cy="230" r="5" fill="#6ee7b7"/>
    <circle cx="276" cy="240" r="5.5" fill="#38bdf8"/>
    <circle cx="256" cy="280" r="6" fill="#a7f3d0"/>
    <circle cx="216" cy="265" r="4" fill="#818cf8"/>
    <circle cx="290" cy="270" r="4" fill="#34d399"/>
  </g>

  <!-- Spherical Specular Gloss (Glass Reflection Top-Left) -->
  <ellipse cx="218" cy="192" rx="46" ry="24" fill="url(#glassGloss)" transform="rotate(-30 218 192)"/>

  <!-- Secondary Rim Lighting (Bottom-Right Cyan Crescent) -->
  <path d="M298 320 A 104 104 0 0 0 352 260" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>
</svg>
